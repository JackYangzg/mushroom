plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.dagger.hilt.android'
    id 'kotlin-kapt'
}

// 读取 gitignored 的 local.properties 中的 API key，绝不入仓。
// 详见 .env.example
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}
def minimaxApiKey = localProps.getProperty('MINI_MAX_API_KEY', '')
def arkApiKey = localProps.getProperty('ARK_API_KEY', '')
def releaseStoreFile = localProps.getProperty(
    'RELEASE_STORE_FILE',
    project.findProperty('RELEASE_STORE_FILE') ?: '',
)
def releaseStorePassword = localProps.getProperty(
    'RELEASE_STORE_PASSWORD',
    project.findProperty('RELEASE_STORE_PASSWORD') ?: '',
)
def releaseKeyAlias = localProps.getProperty(
    'RELEASE_KEY_ALIAS',
    project.findProperty('RELEASE_KEY_ALIAS') ?: '',
)
def releaseKeyPassword = localProps.getProperty(
    'RELEASE_KEY_PASSWORD',
    project.findProperty('RELEASE_KEY_PASSWORD') ?: '',
)

android {
    namespace 'com.yangzhiguo.mushroom'
    compileSdk 34

    defaultConfig {
        applicationId "com.yangzhiguo.mushroom"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        // 注入到 BuildConfig.MINIMAX_API_KEY
        buildConfigField "String", "MINIMAX_API_KEY", "\"${minimaxApiKey}\""
        buildConfigField "String", "MINIMAX_API_BASE", "\"https://api.minimaxi.com\""
        buildConfigField "String", "MINIMAX_MODEL", "\"MiniMax-M3\""
        buildConfigField "String", "ARK_API_KEY", "\"${arkApiKey}\""
        buildConfigField "String", "ARK_API_BASE", "\"https://ark.cn-beijing.volces.com\""
        buildConfigField "String", "ARK_MODEL", "\"doubao-seed-2-0-pro-260215\""
    }

    signingConfigs {
        release {
            if (releaseStoreFile) {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            it.systemProperty 'robolectric.logging.enabled', 'false'
            if (project.hasProperty('generateOfflineDatabase')) {
                it.systemProperty 'mushroom.generateOfflineDatabase', 'true'
            }
        }
        unitTests.returnDefaultValues = true   // 让 android.util.Log 等桩方法返回默认值(否则 Log.i 抛 'not mocked')
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            '-opt-in=androidx.compose.material3.ExperimentalMaterial3Api',
            '-opt-in=androidx.compose.foundation.ExperimentalFoundationApi',
            '-opt-in=com.google.accompanist.permissions.ExperimentalPermissionsApi',
        ]
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.1'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // AndroidX core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'

    // Material XML theme (for Theme.Mushroom parent)
    implementation 'com.google.android.material:material:1.11.0'

    // Compose BOM
    implementation platform('androidx.compose:compose-bom:2023.08.00')
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.foundation:foundation'

    // Compose Navigation
    implementation 'androidx.navigation:navigation-compose:2.7.6'

    // Hilt
    implementation 'com.google.dagger:hilt-android:2.48'
    kapt 'com.google.dagger:hilt-compiler:2.48'
    implementation 'androidx.hilt:hilt-navigation-compose:1.1.0'

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // Image loading
    implementation 'io.coil-kt:coil-compose:2.5.0'

    // Camera permission
    implementation 'com.google.accompanist:accompanist-permissions:0.32.0'

    // JSON
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.0'


    // WorkManager + Hilt integration for background sync
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'androidx.hilt:hilt-work:1.1.0'
    kapt 'androidx.hilt:hilt-compiler:1.1.0'

    // Retrofit (kept for forward-compat; not used in MVP)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'org.xerial:sqlite-jdbc:3.45.3.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2023.08.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
